services:
  postgresql:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE__USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-example}
      POSTGRES_DB: ${DATABASE__NAME:-mini_rust_api}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations, then exits
  migrate:
    build: .
    entrypoint: ["/usr/local/bin/migration"]
    command: ["up"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE__HOST: postgresql
      DATABASE__PORT: "5432"
      DATABASE__USERNAME: ${DATABASE__USERNAME:-postgres}
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:-example}
      DATABASE__NAME: ${DATABASE__NAME:-mini_rust_api}
    depends_on:
      postgresql:
        condition: service_healthy

  mini-rust-api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE__HOST: postgresql
      DATABASE__PORT: "5432"
      DATABASE__USERNAME: ${DATABASE__USERNAME:-postgres}
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:-example}
      DATABASE__NAME: ${DATABASE__NAME:-mini_rust_api}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
