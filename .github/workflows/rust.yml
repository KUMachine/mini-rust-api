name: Cargo Build & Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every gate (format, clippy, tests, docs) with the pinned toolchain;
  # identical to running `cargo xtask check` locally
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install # version from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check

  # Early warning for newer toolchains (new lints, regressions); never blocks merges
  toolchain_preview:
    name: Toolchain Preview (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    env:
      # Overrides rust-toolchain.toml
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal -c clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked

  # Verify latest dependencies work
  latest_deps:
    name: Latest Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: latest-deps
      - run: cargo update --verbose
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
